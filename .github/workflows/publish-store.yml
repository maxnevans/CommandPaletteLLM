name: Publish to Microsoft Store

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: microsoft-store-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and submit Store package
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PACKAGE_DIRECTORY: AppPackages

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Derive package version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
              throw "Release tags must use the form vMajor.Minor.Patch. Received '$tag'."
          }

          $parts = @(
              [int]$Matches.major
              [int]$Matches.minor
              [int]$Matches.patch
          )

          if ($parts.Where({ $_ -gt 65535 }).Count -ne 0) {
              throw "Each MSIX version component must be between 0 and 65535."
          }

          $semanticVersion = $parts -join '.'
          "semantic_version=$semanticVersion" >> $env:GITHUB_OUTPUT
          "store_version=$semanticVersion.0" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore CommandPaletteLLM.sln

      - name: Run tests
        run: dotnet test CommandPaletteLLM.sln --configuration Release --no-restore -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Apply tag version to Store manifest
        shell: pwsh
        run: |
          $manifestPath = "CommandPaletteLLM\Package.appxmanifest"
          [xml] $manifest = Get-Content -Raw -LiteralPath $manifestPath
          $manifest.Package.Identity.Version = "${{ steps.version.outputs.store_version }}"
          $manifest.Save((Resolve-Path -LiteralPath $manifestPath))

      - name: Build Store upload bundle
        shell: pwsh
        run: |
          msbuild CommandPaletteLLM\CommandPaletteLLM.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:Version=${{ steps.version.outputs.semantic_version }} `
            /p:AssemblyVersion=${{ steps.version.outputs.store_version }} `
            /p:FileVersion=${{ steps.version.outputs.store_version }} `
            /p:AppxPackageVersion=${{ steps.version.outputs.store_version }} `
            /p:AppxBundlePlatforms="x64|ARM64" `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\$env:PACKAGE_DIRECTORY\" `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxSymbolPackageEnabled=false `
            /p:GenerateAppxPackageOnBuild=true

      - name: Locate Store upload package
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path $env:PACKAGE_DIRECTORY -Recurse -File -Filter *.msixupload)
          if ($packages.Count -ne 1) {
              throw "Expected exactly one .msixupload file, but found $($packages.Count)."
          }

          "path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Save Store package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CommandPaletteLLM-${{ github.ref_name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Authenticate with Partner Center
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      - name: Submit package to Microsoft Store
        shell: pwsh
        run: |
          msstore publish "${{ github.workspace }}\CommandPaletteLLM" `
            --inputFile "${{ steps.package.outputs.path }}" `
            --appId "${{ vars.STORE_PRODUCT_ID }}"
