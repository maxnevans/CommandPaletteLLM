name: Publish WinGet installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: winget-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish unsigned installers
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WINGET_OUTPUT: artifacts\winget

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Derive release version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
              throw "Release tags must use the form vMajor.Minor.Patch. Received '$tag'."
          }

          $parts = @(
              [int]$Matches.major
              [int]$Matches.minor
              [int]$Matches.patch
          )

          if (@($parts | Where-Object { $_ -gt 65535 }).Count -ne 0) {
              throw 'Each version component must be between 0 and 65535.'
          }

          "version=$($parts -join '.')" >> $env:GITHUB_OUTPUT

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CommandPaletteLLM.sln

      - name: Run tests
        run: dotnet test CommandPaletteLLM.sln --configuration Release --no-restore -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Stage unpackaged applications
        shell: pwsh
        run: >-
          .\scripts\Build-WinGetInstaller.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Platforms all
          -StageOnly

      - name: Compile installers
        shell: pwsh
        run: >-
          .\scripts\Build-WinGetInstaller.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Platforms all
          -PackageOnly

      - name: Verify unsigned installers
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\$env:WINGET_OUTPUT\installer" -File -Filter *.exe)
          if ($installers.Count -ne 2) {
              throw "Expected two unsigned installers, but found $($installers.Count)."
          }

          foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne 'NotSigned') {
                  throw "Expected '$($installer.Name)' to be unsigned, but its signature status is '$($signature.Status)'."
              }
          }

      - name: Save installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CommandPaletteLLM-${{ github.ref_name }}-installers
          path: artifacts/winget/installer/*.exe
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installers = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\$env:WINGET_OUTPUT\installer" -File -Filter *.exe)
          $paths = $installers.FullName

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @paths --clobber --repo "${{ github.repository }}"
          }
          else {
              gh release create $tag @paths `
                  --verify-tag `
                  --generate-notes `
                  --title "Command Palette LLM $tag" `
                  --repo "${{ github.repository }}"
          }
