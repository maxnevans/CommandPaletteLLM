name: Publish WinGet installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: winget-release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish unsigned installers
    runs-on: windows-latest
    timeout-minutes: 60

    outputs:
      version: ${{ steps.version.outputs.version }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      WINGET_OUTPUT: artifacts\winget

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Derive release version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$') {
              throw "Release tags must use the form vMajor.Minor.Patch. Received '$tag'."
          }

          $parts = @(
              [int]$Matches.major
              [int]$Matches.minor
              [int]$Matches.patch
          )

          if (@($parts | Where-Object { $_ -gt 65535 }).Count -ne 0) {
              throw 'Each version component must be between 0 and 65535.'
          }

          "version=$($parts -join '.')" >> $env:GITHUB_OUTPUT

      - name: Refuse to overwrite published installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $expectedAssetNames = @(
              "CommandPaletteLLM-Setup-$version-x64.exe"
              "CommandPaletteLLM-Setup-$version-arm64.exe"
          )

          $releaseJson = gh release view $tag `
              --repo "${{ github.repository }}" `
              --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
              Write-Host "No existing GitHub Release was found for '$tag'."
              exit 0
          }

          $release = $releaseJson | ConvertFrom-Json
          $existingAssetNames = @($release.assets | ForEach-Object { $_.name })
          $conflicts = @($expectedAssetNames | Where-Object { $existingAssetNames -contains $_ })
          if ($conflicts.Count -ne 0) {
              $conflictList = $conflicts -join ', '
              throw "Release '$tag' already contains immutable installer asset(s): $conflictList. Do not rebuild or replace a published installer; publish a new version tag instead."
          }

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CommandPaletteLLM.sln

      - name: Run tests
        run: dotnet test CommandPaletteLLM.sln --configuration Release --no-restore -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Stage applications and sparse identity packages
        shell: pwsh
        run: >-
          .\scripts\Build-WinGetInstaller.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Platforms all
          -StageOnly

      - name: Compile installers
        shell: pwsh
        run: >-
          .\scripts\Build-WinGetInstaller.ps1
          -Version "${{ steps.version.outputs.version }}"
          -Platforms all
          -PackageOnly

      - name: Verify sparse package signatures
        shell: pwsh
        run: |
          foreach ($platform in 'win-x64', 'win-arm64') {
              $directory = Join-Path "$env:GITHUB_WORKSPACE\$env:WINGET_OUTPUT\publish" $platform
              $packagePath = Join-Path $directory 'CommandPaletteLLM.identity.msix'
              $certificatePath = Join-Path $directory 'CommandPaletteLLM.identity.cer'
              $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
              $signature = Get-AuthenticodeSignature -LiteralPath $packagePath

              if ($null -eq $signature.SignerCertificate -or
                  $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint -or
                  $certificate.Subject -ne 'CN=CommandPaletteLLM Community Package') {
                  throw "The $platform sparse package signature does not match its public certificate."
              }
          }

      - name: Verify unsigned installers
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\$env:WINGET_OUTPUT\installer" -File -Filter *.exe)
          if ($installers.Count -ne 2) {
              throw "Expected two unsigned installers, but found $($installers.Count)."
          }

          foreach ($installer in $installers) {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne 'NotSigned') {
                  throw "Expected '$($installer.Name)' to be unsigned, but its signature status is '$($signature.Status)'."
              }
          }

      - name: Save installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CommandPaletteLLM-${{ github.ref_name }}-installers
          path: artifacts/winget/installer/*.exe
          if-no-files-found: error

      - name: Create GitHub release or upload new assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $installers = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\$env:WINGET_OUTPUT\installer" -File -Filter *.exe)
          $paths = $installers.FullName

          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag @paths --repo "${{ github.repository }}"
          }
          else {
              gh release create $tag @paths `
                  --verify-tag `
                  --generate-notes `
                  --title "Command Palette LLM $tag" `
                  --repo "${{ github.repository }}"
          }

  submit-winget:
    name: Submit WinGet manifest update
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Install WingetCreate runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Submit manifest update
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
              throw 'The WINGET_PAT repository secret is required for automatic WinGet submission.'
          }

          $version = "${{ needs.publish.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"
          $x64Url = "https://github.com/$repository/releases/download/$tag/CommandPaletteLLM-Setup-$version-x64.exe"
          $arm64Url = "https://github.com/$repository/releases/download/$tag/CommandPaletteLLM-Setup-$version-arm64.exe"
          $wingetCreate = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'

          Invoke-WebRequest `
              -Uri 'https://aka.ms/wingetcreate/latest' `
              -OutFile $wingetCreate

          & $wingetCreate update 'maxnevans.CommandPaletteLLM' `
              --version $version `
              --urls "$x64Url|x64" "$arm64Url|arm64" `
              --release-notes-url "https://github.com/$repository/releases/tag/$tag" `
              --submit `
              --no-open
          if ($LASTEXITCODE -ne 0) {
              throw "WingetCreate failed with exit code $LASTEXITCODE."
          }
